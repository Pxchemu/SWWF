name: SWWF - sonda historii ECMWF (jednorazowa)

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Opcjonalnie daty RRRR-MM-DD po przecinku, np. 2024-12-13,2025-06-01 (puste = 1. i 15. dzien kazdego miesiaca od 2024-01)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pobierz zawartosc repo
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: pip install requests

      - name: Sprawdz historie ECMWF
        run: python probe_ecmwf_history.py "${{ inputs.date }}"
