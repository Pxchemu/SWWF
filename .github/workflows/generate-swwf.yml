name: SWWF - generuj prognoze

on:
  workflow_dispatch:   # nadal mozna uruchomic recznie, przyciskiem
  schedule:
    # uruchamia sie samo, cztery razy dziennie: 5:00, 11:00, 17:00, 23:00 UTC
    # (kilka godzin po kazdym przebiegu GEFS 00/06/12/18Z, zeby dane zdazyly
    # sie pojawic na AWS zanim je pobierzemy)
    - cron: '0 5,11,17,23 * * *'

# domyslny token GitHub Actions ma prawo tylko ODCZYTU repo (widziales to w logu:
# "Contents: read") - zeby workflow mogl sam zapisac wynik z powrotem, trzeba
# mu jawnie dac prawo zapisu:
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz zawartosc repo
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: pip install herbie-data

      - name: Wygeneruj swwf.json
        run: python generate_swwf.py

      - name: Zapisz wynik z powrotem do repo
        run: |
          git config user.name "SWWF Bot"
          git config user.email "actions@github.com"
          git add swwf.json
          git diff --staged --quiet || git commit -m "Aktualizacja swwf.json"
          git push
