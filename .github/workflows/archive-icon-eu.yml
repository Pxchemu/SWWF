name: SWWF - archiwizuj ICON-EU

on:
  workflow_dispatch:   # mozna tez uruchomic recznie
    inputs:
      run:
        description: 'Przebieg do pobrania "RRRR-MM-DD GG" (UTC, GG = 00/06/12/18; tylko z ostatniej doby). Puste = automatycznie'
        required: false
        default: ''
  schedule:
    # cztery razy dziennie, ~4,5 h po przebiegach ICON-EU 00/06/12/18Z (DWD publikuje pliki
    # ok. 2,5-3,5 h po czasie przebiegu). Skrypt sam wylicza, o ktory przebieg chodzi, i czeka
    # do godziny, jesli pliki jeszcze nie sa komplet.
    # Harmonogram GitHub Actions bywa spozniony albo pomijany, a archiwum ICON-EU nie da sie odtworzyc
    # wstecz — dlatego kazde okno ma zapasowe podejscie godzine pozniej (nieokragla minuta). Skrypt
    # pomija przebieg, ktory jest juz zapisany, wiec dodatkowe uruchomienia nic nie dubluja.
    - cron: '17 4,5,10,11,16,17,22,23 * * *'

permissions:
  contents: write

# jeden przebieg archiwizacji naraz (nie przerywamy trwajacego)
concurrency:
  group: archive-icon-eu
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ICON_RUN: ${{ inputs.run }}
    steps:
      - name: Pobierz zawartosc repo
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: pip install eccodes requests

      - name: Pobierz i zapisz prognoze ICON-EU
        run: python archive_icon_eu.py "$ICON_RUN"

      - name: Zapisz wynik do repo
        run: |
          git config user.name "SWWF Bot"
          git config user.email "actions@github.com"
          git add icon_archive/
          git diff --staged --quiet && exit 0
          git commit -m "Archiwum ICON-EU"
          # inne workflow (generuj prognoze, weryfikacja) tez pushuja na main, wiec rebase + ponawianie;
          # pliki archiwum sa unikalne dla przebiegu, wiec konfliktow tu nie ma
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
