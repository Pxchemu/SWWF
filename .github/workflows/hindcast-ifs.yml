name: SWWF - hindcast IFS ENS dla stacji IMGW (porownanie z GEFS)

on:
  workflow_dispatch:   # tylko recznie
    inputs:
      runs:
        description: 'Przebiegi IFS ENS po przecinku, "RRRR-MM-DD GG" (UTC; GG = 00 lub 12; od 2024-03; pelny zestaw zmiennych od 2024-11-15), np. 2025-01-15 00,2025-01-16 00'
        required: true
      chunk_size:
        description: 'Ilu czlonkow na jedno zadanie (51 czlonkow: 0 = kontrolny, 1-50). 26 = 2 zadania na przebieg (zalecane: kazde zadanie czyta ~26 indeksow ECMWF, a to one najczesciej dostaja 503, wiec im mniej zadan, tym mniej ryzyka); 12 = 5 zadan na przebieg. GitHub dopuszcza max 256 zadan w jednym uruchomieniu'
        required: true
        default: '26'
      extras:
        description: 'Pobierac tez 2d, 10u, 10v, mn2t3, mx2t3, 10fg, mucape, ptype (kilka razy wiecej danych; domyslnie tylko 2t i tp)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.make.outputs.matrix }}
    env:
      HC_RUNS: ${{ inputs.runs }}
      HC_CHUNK: ${{ inputs.chunk_size }}
    steps:
      - name: Zbuduj liste zadan (przebieg x kawalek czlonkow)
        id: make
        run: |
          python3 - <<'EOF'
          import json, os, re, sys
          runs = [r.strip() for r in os.environ["HC_RUNS"].split(",") if r.strip()]
          chunk = int(os.environ["HC_CHUNK"])
          if not runs or not (1 <= chunk <= 51):
              sys.exit("Pusta lista przebiegow albo zly rozmiar kawalka (1-51).")
          include = []
          for r in runs:
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2} (00|12)", r):
                  sys.exit(f"Zly przebieg: {r!r} (oczekiwane 'RRRR-MM-DD GG', GG = 00 lub 12)")
              if r < "2024-03-01":
                  sys.exit(f"{r}: IFS ENS 0.25 na AWS jest dostepny dopiero od 2024-03")
          # kolejnosc: kawalek po kawalku przez WSZYSTKIE przebiegi, wiec rownolegle zadania trafiaja w rozne
          # katalogi dat na serwerze ECMWF (jeden katalog = jeden prefiks S3, ktory dlawi przy duzym ruchu)
          for a in range(0, 51, chunk):
              b = min(a + chunk - 1, 50)
              for r in runs:
                  include.append({"run": r, "m_from": a, "m_to": b,
                                  "tag": f"{r.replace(' ', '_')}_m{a}-{b}"})
          print(f"Zadan: {len(include)}")
          if len(include) > 256:
              sys.exit(f"Za duzo zadan ({len(include)}): GitHub dopuszcza max 256 w jednym uruchomieniu. "
                       f"Zmniejsz liczbe przebiegow albo zwieksz chunk_size (np. 26 daje 2 zadania na przebieg, czyli do 128 przebiegow).")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")
          EOF

  extract:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false      # blad jednego kawalka nie zabija reszty
      max-parallel: 6       # ECMWF S3 dlawi (503 SlowDown) przy zbyt wielu rownoleglych zapytaniach
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      HC_RUN: ${{ matrix.run }}
      HC_FROM: ${{ matrix.m_from }}
      HC_TO: ${{ matrix.m_to }}
      IFS_EXTRAS: ${{ inputs.extras && '1' || '0' }}
      IFS_WORKERS: '4'
      ECMWF_BACKOFF: '1.5'   # krotsza pierwsza przerwa po 503 (domyslnie 5 s): przy ~40% odrzucen 5 s czekania to wiekszosc czasu zadania
    steps:
      - name: Pobierz zawartosc repo
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: pip install eccodes requests

      - name: Wyciagnij dane IFS ENS dla stacji
        # serwer ECMWF potrafi dlawic (503) przez kilka minut — do 3 prob calego kawalka z przerwa 3 min
        run: |
          for i in 1 2 3; do
            python hindcast_ifs.py extract "$HC_RUN" "$HC_FROM" "$HC_TO" hindcast_chunks && exit 0
            echo "::warning::Proba $i z 3 nieudana (zwykle 503 z serwera ECMWF)"
            [ "$i" -lt 3 ] && sleep 180
          done
          exit 1

      - name: Zachowaj wynik kawalka
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.tag }}
          path: hindcast_chunks/
          if-no-files-found: ignore
          retention-days: 3

  commit:
    needs: [plan, extract]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz zawartosc repo
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz kawalki
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          merge-multiple: true
          path: hindcast_chunks

      - name: Scal kawalki w pliki na przebieg
        run: python hindcast_points.py merge hindcast_chunks hindcast_ifs

      - name: Zapisz wynik do repo
        run: |
          git config user.name "SWWF Bot"
          git config user.email "actions@github.com"
          git add hindcast_ifs/
          git diff --staged --quiet && exit 0
          git commit -m "Hindcast IFS ENS dla stacji IMGW"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
