name: SWWF - raport kalibracji (hindcast vs IMGW)

on:
  workflow_dispatch:   # tylko recznie
    inputs:
      hindcast_dir:
        description: 'Folder z plikami hindcast (hindcast_v2 = rozszerzone dane z wiatrem i wilgotnoscia, hindcast = pilot)'
        required: true
        default: 'hindcast_v2'
      obs_file:
        description: 'Plik obserwacji w repo (puste = najnowszy obs/imgw_dobowe_*.csv.gz)'
        required: false
        default: ''
      common_with:
        description: 'Porownanie modeli: drugi folder hindcastu (np. hindcast_ifs dla hindcast_v2 i odwrotnie); licza sie tylko przebiegi wspolne. Puste = wszystkie'
        required: false
        default: ''
      pool_with:
        description: 'ZESPOL POLACZONY: drugi folder hindcastu, ktorego czlonkowie dolacza do zespolu (np. hindcast_v2 + pool_with=hindcast_ifs). Puste = bez laczenia'
        required: false
        default: ''
      pool_weights:
        description: 'Powtorzenia czlonkow A:B przy laczeniu (5:3 = rowna waga modeli przy 30 GEFS i 51 IFS; 1:1 = zwykle zlaczenie)'
        required: false
        default: '5:3'
      pool_shift_a:
        description: 'Korekta temperatury (C) czlonkow pierwszego modelu (GEFS) PRZED zlaczeniem; GEFS jest za cieply o ok. 1.3 C, wiec np. -1.3. 0 = bez korekty. Dziala tylko z pool_with'
        required: false
        default: '0'
      min_members:
        description: 'Minimalna liczba czlonkow w przebiegu (GEFS 30, IFS ENS 50)'
        required: false
        default: '30'
      skip:
        description: 'Sekcje do pominiecia po przecinku: ice, blizzard (dla IFS: ice,blizzard)'
        required: false
        default: ''
      tag:
        description: 'Dopisek do nazwy raportu (np. wspolne_z_ifs)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HC_DIR: ${{ inputs.hindcast_dir }}
      OBS_FILE: ${{ inputs.obs_file }}
      COMMON_WITH: ${{ inputs.common_with }}
      POOL_WITH: ${{ inputs.pool_with }}
      POOL_WEIGHTS: ${{ inputs.pool_weights }}
      POOL_SHIFT_A: ${{ inputs.pool_shift_a }}
      MIN_MEMBERS: ${{ inputs.min_members }}
      SKIP_SECTIONS: ${{ inputs.skip }}
      REPORT_TAG: ${{ inputs.tag }}
    steps:
      - name: Pobierz zawartosc repo
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: pip install numpy

      - name: Policz raport
        run: |
          NAME="$HC_DIR"; if [ -n "$REPORT_TAG" ]; then NAME="${HC_DIR}_${REPORT_TAG}"; fi
          ARGS=(--hindcast "$HC_DIR" --out "reports/calibration_report_${NAME}.md" --min-members "${MIN_MEMBERS:-30}")
          if [ -n "$OBS_FILE" ]; then ARGS+=(--obs "$OBS_FILE"); fi
          if [ -n "$COMMON_WITH" ]; then ARGS+=(--common-with "$COMMON_WITH"); fi
          if [ -n "$POOL_WITH" ]; then ARGS+=(--pool-with "$POOL_WITH" --pool-weights "${POOL_WEIGHTS:-5:3}" "--pool-shift-a=${POOL_SHIFT_A:-0}"); fi
          if [ -n "$SKIP_SECTIONS" ]; then ARGS+=(--skip "$SKIP_SECTIONS"); fi
          ARGS+=(--scores-out "reports/scores_${NAME}.npz")
          python calibrate_swwf.py "${ARGS[@]}"

      - name: Zapisz raport do repo
        run: |
          git config user.name "SWWF Bot"
          git config user.email "actions@github.com"
          git add reports/
          git diff --staged --quiet && exit 0
          git commit -m "Raport kalibracji SWWF"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
